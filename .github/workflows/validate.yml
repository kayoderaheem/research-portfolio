name: Validate Research Automation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check automation files
        run: |
          python -m py_compile scripts/*.py
          python -m json.tool config/research-focus.json >/dev/null
          python -m json.tool .research-ideas/ledger.json >/dev/null
