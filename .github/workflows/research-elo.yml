name: Research Problem-Choice Review

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional [Idea] issue number to evaluate; leave blank for automatic selection"
        required: false
        type: string
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write
  copilot-requests: write

concurrency:
  group: research-portfolio-elo
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[Idea]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve issue number
        id: issue
        env:
          MANUAL: ${{ inputs.issue_number }}
          EVENT: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$MANUAL" ]; then
            number="$MANUAL"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            number="$EVENT"
          else
            number="$(python scripts/select_research_elo_issue.py)"
          fi
          echo "Selected issue #$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Prepare problem comparisons
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/research_elo.py prepare \
            --issue "${{ steps.issue.outputs.number }}" \
            --prompt-file /tmp/research-prompt.txt \
            --context-file /tmp/research-context.json \
            --status-file /tmp/research-status.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          status = json.load(open('/tmp/research-status.json'))
          print(f"ready={str(status['ready']).lower()}")
          print(f"idea_count={status['idea_count']}")
          PY

      - name: Explain deferred comparison
        if: steps.plan.outputs.ready != 'true'
        run: echo "::notice::Comparison waits until at least two eligible open [Idea] issues exist."

      - name: Set up Node.js
        if: steps.plan.outputs.ready == 'true'
        uses: actions/setup-node@v7

      - name: Install GitHub Copilot CLI
        if: steps.plan.outputs.ready == 'true'
        run: npm install -g @github/copilot@latest

      - name: Review research problems
        if: steps.plan.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          timeout 360s copilot --yolo -p "$(cat /tmp/research-prompt.txt)" > /tmp/research-result.txt
          test -s /tmp/research-result.txt

      - name: Apply ratings and post decision evidence
        if: steps.plan.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/research_elo.py apply \
            --issue "${{ steps.issue.outputs.number }}" \
            --context-file /tmp/research-context.json \
            --result-file /tmp/research-result.txt

      - name: Refresh research ranking
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/render_research_elo.py

      - name: Commit portfolio state
        run: |
          if git diff --quiet -- .research-elo/ratings.json README.md; then
            echo "No ranking changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .research-elo/ratings.json README.md
          git commit -m "Update research problem-choice ranking"
          git push
