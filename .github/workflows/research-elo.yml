name: Research Problem-Choice Review

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Owner-authored [Idea] issue number to evaluate"
        required: true
        type: string
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write
  copilot-requests: write

concurrency:
  group: research-portfolio-elo
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[Idea]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve issue number
        id: issue
        env:
          MANUAL: ${{ inputs.issue_number }}
          EVENT: ${{ github.event.issue.number }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=$MANUAL" >> "$GITHUB_OUTPUT"
          else
            echo "number=$EVENT" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare problem comparisons
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/research_elo.py prepare \
            --issue "${{ steps.issue.outputs.number }}" \
            --prompt-file /tmp/research-prompt.txt \
            --context-file /tmp/research-context.json \
            --status-file /tmp/research-status.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          status = json.load(open('/tmp/research-status.json'))
          print(f"ready={str(status['ready']).lower()}")
          print(f"idea_count={status['idea_count']}")
          PY

      - name: Explain deferred comparison
        if: steps.plan.outputs.ready != 'true'
        run: echo "::notice::The idea was published, but comparison waits until a second open [Idea] issue exists."

      - name: Set up Node.js
        if: steps.plan.outputs.ready == 'true'
        uses: actions/setup-node@v7

      - name: Install GitHub Copilot CLI
        if: steps.plan.outputs.ready == 'true'
        run: npm install -g @github/copilot@latest

      - name: Review research problems
        if: steps.plan.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          timeout 300s copilot --yolo -p "$(cat /tmp/research-prompt.txt)" > /tmp/research-result.txt
          test -s /tmp/research-result.txt

      - name: Apply ratings and post decision evidence
        if: steps.plan.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/research_elo.py apply \
            --issue "${{ steps.issue.outputs.number }}" \
            --context-file /tmp/research-context.json \
            --result-file /tmp/research-result.txt

      - name: Refresh public portfolio
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/render_research_elo.py

      - name: Commit portfolio state
        run: |
          if git diff --quiet -- .research-elo/ratings.json data/portfolio.json README.md; then
            echo "No portfolio changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .research-elo/ratings.json data/portfolio.json README.md
          git commit -m "Update research problem-choice portfolio"
          git push
